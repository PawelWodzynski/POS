<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}POS{% endblock %}</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root { --brand: #0d6efd; --muted: #6c757d; }
    body { padding-top: 66px; background: linear-gradient(180deg, #f7fbff 0%, #eef5ff 60%); color: #333; }
    .navbar-brand { font-weight: 600; letter-spacing: .5px; }
    .app-container { min-height: calc(100vh - 66px); padding: 24px 0; }
    .brand-badge { display:inline-flex; align-items:center; gap:8px; }
    .brand-badge .bi { font-size:1.25rem; }
    footer.site-footer { padding: 24px 0; color: var(--muted); font-size:.9rem; margin-top:48px; }
    #category-buttons .btn { white-space: nowrap; margin-left: 4px; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-white bg-white shadow-sm fixed-top">
    <div class="container d-flex justify-content-between align-items-center">
      <!-- Brand -->
      <a class="navbar-brand brand-badge" href="{{ url_for('auth.root_redirect') }}">
        <i class="bi bi-basket3 text-primary"></i>
        <span class="ms-1 fw-bold">POS</span>
      </a>

      <!-- Kategorie (dynamiczne) -->
      <div id="category-buttons" class="d-flex gap-2 flex-wrap justify-content-center"></div>

      <!-- Login/Register -->
      <div class="btn-group" role="group">
        <a href="{{ url_for('auth.login_page') }}" class="btn btn-outline-primary">Login</a>
        <a href="{{ url_for('auth.register_page') }}" class="btn btn-primary">Register</a>
      </div>
    </div>
  </nav>

  <main class="container app-container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer text-center">
    <div class="container">
      <small class="text-muted">© {{ (range(2020, (2020 + 6))|first) }} POS — Demo project</small>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

  {% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', async () => {
    console.log('DOM loaded, starting category fetch...');
    try {
        const res = await fetch('/api/categories', { cache: 'no-store' });
        console.log('Response status:', res.status);
        const cats = await res.json();
        console.log('Categories:', cats);

        const container = document.getElementById('category-buttons');
        if (!container) return console.error('Container not found');

        cats.forEach(cat => {
            const a = document.createElement('a');
            a.href = '/categories?cat=' + encodeURIComponent(cat);
            a.className = 'btn btn-outline-primary';
            a.textContent = cat;
            container.appendChild(a);
        });
    } catch (err) {
        console.error('Fetch failed', err);
    }
});
</script>
{% endblock %}

</body>
</html>
