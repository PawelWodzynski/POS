{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card card">
    <div class="card-body">
      <div class="text-center mb-4">
        <i class="bi bi-person-plus display-2 text-success"></i>
        <h4 class="mt-2">Create your account</h4>
        <p class="text-muted">Fill the form below to register</p>
      </div>

      <form id="registerForm" novalidate>
        <div class="row g-3">
          <div class="col-md-6">
            <label for="login" class="form-label">Login</label>
            <input type="text" class="form-control" id="login" name="login" placeholder="your login" required>
          </div>
          <div class="col-md-6">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" required>
          </div>

          <div class="col-md-6">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
          </div>
          <div class="col-md-6">
            <label for="password2" class="form-label">Confirm password</label>
            <input type="password" class="form-control" id="password2" name="password2" placeholder="Repeat password" required>
          </div>

          <div class="col-md-6">
            <label for="first_name" class="form-label">First name</label>
            <input type="text" class="form-control" id="first_name" name="first_name">
          </div>
          <div class="col-md-6">
            <label for="last_name" class="form-label">Last name</label>
            <input type="text" class="form-control" id="last_name" name="last_name">
          </div>

          <div class="col-12">
            <label for="city" class="form-label">City</label>
            <input type="text" class="form-control" id="city" name="city">
          </div>
          <div class="col-8">
            <label for="street" class="form-label">Street</label>
            <input type="text" class="form-control" id="street" name="street">
          </div>
          <div class="col-4">
            <label for="postal_code" class="form-label">Postal code</label>
            <input type="text" class="form-control" id="postal_code" name="postal_code">
          </div>
        </div>

        <div id="registerAlert" class="alert alert-danger d-none mt-3" role="alert"></div>

        <div class="d-grid gap-2 mt-3">
          <button type="submit" class="btn btn-success">Create account</button>
        </div>
      </form>

      <hr class="my-4">

      <div class="d-flex justify-content-between align-items-center">
        <small class="text-muted">Already have an account?</small>
        <a href="{{ url_for('auth.login_page') }}" class="btn btn-outline-secondary btn-sm">Sign in</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
(function () {
  const form = document.getElementById('registerForm');
  const alertEl = document.getElementById('registerAlert');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    alertEl.classList.add('d-none');

    const data = {
      login: document.getElementById('login').value.trim(),
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value,
      password2: document.getElementById('password2').value,
      first_name: document.getElementById('first_name').value.trim(),
      last_name: document.getElementById('last_name').value.trim(),
      city: document.getElementById('city').value.trim(),
      street: document.getElementById('street').value.trim(),
      postal_code: document.getElementById('postal_code').value.trim()
    };

    if (!data.login || !data.email || !data.password) {
      alertEl.textContent = 'Login, email and password are required';
      alertEl.classList.remove('d-none');
      return;
    }

    if (data.password !== data.password2) {
      alertEl.textContent = 'Passwords do not match';
      alertEl.classList.remove('d-none');
      return;
    }

    try {
      const res = await fetch('{{ url_for("auth.api_register") }}', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        alertEl.textContent = body.error || body.detail || 'Registration failed';
        alertEl.classList.remove('d-none');
        return;
      }

      // store token and redirect
      localStorage.setItem('access_token', body.access_token);
      localStorage.setItem('user_id', body.user_id);
      window.location.href = '/main-page';
    } catch (err) {
      alertEl.textContent = 'Network error';
      alertEl.classList.remove('d-none');
    }
  });
})();
</script>
{% endblock %}
