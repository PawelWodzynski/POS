{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card card">
    <div class="card-body">
      <div class="text-center mb-4">
        <i class="bi bi-person-plus display-2 text-success"></i>
        <h4 class="mt-2">Create your account</h4>
        <p class="text-muted">Fill the form below to register</p>
      </div>

      <form id="registerForm" novalidate>
        <div class="row g-3">
          <div class="col-md-6">
            <label for="login" class="form-label">Login</label>
            <input type="text" class="form-control" id="login" name="login" placeholder="your login" required>
          </div>
          <div class="col-md-6">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" required>
          </div>

          <div class="col-md-6">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
          </div>
          <div class="col-md-6">
            <label for="password2" class="form-label">Confirm password</label>
            <input type="password" class="form-control" id="password2" name="password2" placeholder="Repeat password" required>
          </div>

          <div class="col-md-6">
            <label for="first_name" class="form-label">First name</label>
            <input type="text" class="form-control" id="first_name" name="first_name">
          </div>
          <div class="col-md-6">
            <label for="last_name" class="form-label">Last name</label>
            <input type="text" class="form-control" id="last_name" name="last_name">
          </div>

          <div class="col-12">
            <label for="city" class="form-label">City</label>
            <input type="text" class="form-control" id="city" name="city">
          </div>
          <div class="col-8">
            <label for="street" class="form-label">Street</label>
            <input type="text" class="form-control" id="street" name="street">
          </div>
          <div class="col-4">
            <label for="postal_code" class="form-label">Postal code</label>
            <input type="text" class="form-control" id="postal_code" name="postal_code">
          </div>
        </div>

        <div id="registerAlert" class="alert alert-danger d-none mt-3" role="alert"></div>

        <div class="d-grid gap-2 mt-3">
          <button type="submit" class="btn btn-success">Create account</button>
        </div>
      </form>

      <hr class="my-4">

      <div class="d-flex justify-content-between align-items-center">
        <small class="text-muted">Already have an account?</small>
        <a href="{{ url_for('auth.login_page') }}" class="btn btn-outline-secondary btn-sm">Sign in</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
{% endblock %}
