{% extends "base.html" %}

{% block title %}Cart{% endblock %}

{% block content %}
<div class="container">
  <h1>Your Cart</h1>
  <table class="table table-striped" id="cart-table" style="width: 100%;">
    <thead>
      <tr>
        <th scope="col"> </th>
        <th scope="col">Product Name</th>
        <th scope="col">Quantity</th>
        <th scope="col">Price</th>
        <th scope="col">Total</th>
      </tr>
    </thead>
      <tbody>
      <!-- Cart items will be dynamically inserted here -->
      </tbody>
    </table>
  </div>

  <div id="cart-summary" class="mt-3">
    <h4 style="color: green;">Total Price: <span id="total-price">0 PLN</span></h4>
    <button id="accept-cart" class="btn btn-success">Accept</button>
  </div>

  <script src="{{ url_for('static', filename='js/productRendering.js') }}"></script>
  <script src="{{ url_for('static', filename='js/productSearch.js') }}"></script>
  <script src="{{ url_for('static', filename='js/cart.js') }}"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const cartKey = 'cart';
      let cart = JSON.parse(localStorage.getItem(cartKey)) || [];
      const tbody = document.querySelector('#cart-table tbody');
      const totalPriceSpan = document.getElementById('total-price');
      const acceptButton = document.getElementById('accept-cart');
      tbody.innerHTML = '';

      // Function to send cart data to finalize order endpoint
      async function finalizeOrder() {
        const orderData = cart.map(item => ({
          productId: item.productId,
          count: item.quantity
        }));

        try {
          const response = await fetch('/api/order/finalize', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(orderData)
          });
          if (!response.ok) throw new Error('Failed to finalize order');
          const data = await response.json();
          console.log('Order finalized:', data);
          // You can add further UI feedback here, e.g. redirect or show confirmation

          // Asynchronously remove ordered products from localStorage cart
          data.forEach(orderedItem => {
            cart = cart.filter(cartItem => cartItem.productId !== orderedItem.productId);
          });
          localStorage.setItem(cartKey, JSON.stringify(cart));
          updateTotalPrice();
          // Optionally, refresh the page or update UI to reflect empty cart items
          // For now, just reload the page to reflect changes
          location.reload();

        } catch (error) {
          console.error('Error finalizing order:', error);
        }
      }

      acceptButton.addEventListener('click', () => {
        finalizeOrder();
      });

      function updateTotalPrice() {
        let totalSum = 0;
        cart.forEach(item => {
          totalSum += (item.price || 0) * (item.quantity || 1);
        });
        totalPriceSpan.textContent = totalSum.toFixed(2) + ' PLN';

        // Disable accept button if cart is empty or totalSum is 0
        if (cart.length === 0 || totalSum === 0) {
          acceptButton.disabled = true;
          totalPriceSpan.textContent = '0 PLN';
        } else {
          acceptButton.disabled = false;
        }
      }

      // Enrich cart items with product data before rendering and calculating total
      cart.forEach(item => {
        const productKey = 'product_' + item.productId;
        const productData = localStorage.getItem(productKey);
        if (productData) {
          try {
            const product = JSON.parse(productData);
            item.name = product.title;
            item.price = product.price;
            item.image = product.image;
          } catch (e) {
            console.error('Failed to parse product data from localStorage for', productKey, e);
          }
        }
      });

      // Update localStorage with enriched cart items
      localStorage.setItem(cartKey, JSON.stringify(cart));

      // Now update total price after enriching cart items
      updateTotalPrice();

      if (cart.length === 0) {
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = 5;
        td.classList.add('text-center');
        td.textContent = 'Your cart is empty.';
        tr.appendChild(td);
        tbody.appendChild(tr);
        updateTotalPrice();
        return;
      }

      // For each cart item, get product details from localStorage and update cart item
      cart.forEach(item => {
        const productKey = 'product_' + item.productId;
        const productData = localStorage.getItem(productKey);
        if (productData) {
          try {
            const product = JSON.parse(productData);
            item.name = product.title;
            item.price = product.price;
            item.image = product.image;
          } catch (e) {
            console.error('Failed to parse product data from localStorage for', productKey, e);
          }
        }
      });

      // Update localStorage with enriched cart items
      localStorage.setItem(cartKey, JSON.stringify(cart));

      // Call updateTotalPrice here after enriching cart items
      updateTotalPrice();

      // Render cart table rows with image, name, quantity controls, price, total
      cart.forEach(item => {
        const tr = document.createElement('tr');

        const imageTd = document.createElement('td');
        const img = document.createElement('img');
        img.src = item.image || '';
        img.alt = item.name || 'Product image';
        img.style.width = '50px';
        img.style.height = '50px';
        img.style.objectFit = 'contain';
        img.style.marginRight = '10px';
        imageTd.appendChild(img);
        tr.appendChild(imageTd);

        const nameTd = document.createElement('td');
        nameTd.textContent = item.name || 'Unnamed product';
        tr.appendChild(nameTd);

        const quantityTd = document.createElement('td');
        // Create minus button
        const minusBtn = document.createElement('button');
        minusBtn.textContent = '-';
        minusBtn.className = 'btn btn-sm btn-outline-secondary me-2';
        // Create quantity display
        const qtyDisplay = document.createElement('span');
        qtyDisplay.textContent = item.quantity || 1;
        qtyDisplay.style.minWidth = '20px';
        qtyDisplay.style.display = 'inline-block';
        qtyDisplay.style.textAlign = 'center';
        // Create plus button
        const plusBtn = document.createElement('button');
        plusBtn.textContent = '+';
        plusBtn.className = 'btn btn-sm btn-outline-secondary ms-2';

        quantityTd.appendChild(minusBtn);
        quantityTd.appendChild(qtyDisplay);
        quantityTd.appendChild(plusBtn);
        tr.appendChild(quantityTd);

        const priceTd = document.createElement('td');
        priceTd.textContent = item.price ? item.price.toFixed(2) + ' PLN' : '0 PLN';
        tr.appendChild(priceTd);

        const totalTd = document.createElement('td');
        const total = (item.price || 0) * (item.quantity || 1);
        totalTd.textContent = total.toFixed(2) + ' PLN';
        tr.appendChild(totalTd);

        tbody.appendChild(tr);

        // Event listeners for plus and minus buttons
        plusBtn.addEventListener('click', async () => {
          try {
            const response = await fetch('/api/cart/add_product', {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ productId: item.productId, quantity: 1 })
            });
            if (!response.ok) throw new Error('Failed to add product');
            const data = await response.json();

            // Call handlePutProduct to update localStorage product quantity and cart
            if (typeof handlePutProduct === 'function') {
              handlePutProduct(data.productId);
            }
            item.quantity += 1;
            qtyDisplay.textContent = item.quantity;

            // Update total price
            const newTotal = (item.price || 0) * item.quantity;
            totalTd.textContent = newTotal.toFixed(2) + ' PLN';
            updateTotalPrice();
            // Also update accept button state dynamically
            if (item.quantity <= 0 || cart.length === 0) {
              acceptButton.disabled = true;
            } else {
              acceptButton.disabled = false;
            }
          } catch (error) {
            console.error('Error adding product:', error);
          }
        });

        minusBtn.addEventListener('click', async () => {
          try {
            const response = await fetch('/api/cart/remove_product', {
              method: 'DELETE',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ productId: item.productId, quantity: 1 })
            });
            if (!response.ok) throw new Error('Failed to remove product');
            const data = await response.json();

            // Call handleDeleteProduct to update localStorage product quantity and cart
            if (typeof handleDeleteProduct === 'function') {
              handleDeleteProduct(data.productId);
            }
            item.quantity -= 1;
            if (item.quantity <= 0) {
              tr.remove();
              // Remove item from cart array
              cart = cart.filter(cartItem => cartItem.productId !== item.productId);
              localStorage.setItem(cartKey, JSON.stringify(cart));
              updateTotalPrice();
              // Disable accept button and set total price to 0 if cart is empty
              if (cart.length === 0) {
                acceptButton.disabled = true;
                totalPriceSpan.textContent = '0 PLN';
              }
            } else {
              qtyDisplay.textContent = item.quantity;
              // Update total price
              const newTotal = (item.price || 0) * item.quantity;
              totalTd.textContent = newTotal.toFixed(2) + ' PLN';
              updateTotalPrice();
              // Enable or disable accept button based on cart length
              if (cart.length === 0) {
                acceptButton.disabled = true;
                totalPriceSpan.textContent = '0 PLN';
              } else {
                acceptButton.disabled = false;
              }
            }
          } catch (error) {
            console.error('Error removing product:', error);
          }
        });
      });
    });
  </script>
{% endblock %}
