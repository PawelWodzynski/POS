{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
  <h1 class="mb-4">Delivery Products</h1>
  <div class="mb-3 row">
    <label for="productSelect" class="col-sm-2 col-form-label">Select product:</label>
    <div class="col-sm-10">
      <select id="productSelect" class="form-select"></select>
    </div>
  </div>
  <div class="mb-3 row">
    <label for="quantityInput" class="col-sm-2 col-form-label">Quantity:</label>
    <div class="col-sm-10">
      <input type="number" id="quantityInput" min="1" value="1" class="form-control" />
    </div>
  </div>
  <button id="acceptButton" class="btn btn-primary mb-4">Accept</button>

  <h2>Products Table</h2>
  <table id="productsTable" class="table table-striped table-bordered align-middle">
    <thead class="table-dark">
      <tr>
        <th>Product ID</th>
        <th>Name</th>
        <th>Count</th>
        <th>Price</th>
        <th>Image</th>
      </tr>
    </thead>
    <tbody>
      <!-- Rows will be added here -->
    </tbody>
  </table>
  <button id="enterDeliveryButton" class="btn btn-success mt-3">Enter Delivery</button>
</div>

<script src="/static/js/delivery_products.js"></script>
<script src="/static/js/delivery_table.js"></script>

<!-- Modal for creating new product -->
<div class="modal fade" id="createProductModal" tabindex="-1" aria-labelledby="createProductModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form id="createProductForm">
        <div class="modal-header">
          <h5 class="modal-title" id="createProductModalLabel">Create New Product</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="productTitle" class="form-label">Title</label>
            <input type="text" class="form-control" id="productTitle" name="title" required />
          </div>
          <div class="mb-3">
            <label for="productCategory" class="form-label">Category</label>
            <input type="text" class="form-control" id="productCategory" name="category" required />
          </div>
          <div class="mb-3">
            <label for="productDescription" class="form-label">Description</label>
            <textarea class="form-control" id="productDescription" name="description" rows="3" required></textarea>
          </div>
          <div class="mb-3">
            <label for="productPrice" class="form-label">Price</label>
            <input type="number" step="0.01" class="form-control" id="productPrice" name="price" required />
          </div>
          <div class="mb-3">
            <label for="productRatingRate" class="form-label">Rating Rate</label>
            <input type="number" step="0.1" min="0" max="5" class="form-control" id="productRatingRate" name="ratingRate" required />
          </div>
          <div class="mb-3">
            <label for="productImage" class="form-label">Image URL</label>
            <input type="url" class="form-control" id="productImage" name="image" value="https://placehold.co/200x200?text=Produkt" required />
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Create Product</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>

<button id="openCreateProductModalBtn" class="btn btn-info mt-3">Add New Product</button>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const createProductModal = new bootstrap.Modal(document.getElementById('createProductModal'));
  const openModalBtn = document.getElementById('openCreateProductModalBtn');
  const createProductForm = document.getElementById('createProductForm');

  openModalBtn.addEventListener('click', () => {
    createProductForm.reset();
    createProductForm.productImage.value = 'https://placehold.co/200x200?text=Produkt';
    createProductModal.show();
  });

  createProductForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    // Gather form data
    const formData = new FormData(createProductForm);
    const product = {
      title: formData.get('title'),
      category: formData.get('category'),
      description: formData.get('description'),
      price: parseFloat(formData.get('price')),
      rating: {
        rate: parseFloat(formData.get('ratingRate')),
        count: 0
      },
      image: formData.get('image')
    };

    // Generate unique incremented ID based on existing products in localStorage
    let maxId = 0;
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key.startsWith('product_')) {
        try {
          const p = JSON.parse(localStorage.getItem(key));
          if (p.id > maxId) maxId = p.id;
        } catch {}
      }
    }
    product.id = maxId + 1;

    try {
      const response = await fetch('/api/products/create_product_simulation', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(product)
      });
      if (!response.ok) {
        alert('Failed to create product');
        return;
      }
      const createdProduct = await response.json();

      // Add new product to localStorage with count === 0
      const productKey = `product_${createdProduct.id}`;
      localStorage.setItem(productKey, JSON.stringify(createdProduct));

      // Optionally, you can update UI or notify user
      // alert('Product created and added to localStorage with count 0');
      createProductModal.hide();
      // Refresh product select dropdown to include new product
      if (window.populateProductSelect) {
        window.populateProductSelect();
      }
    } catch (error) {
      console.error('Error creating product:', error);
      alert('Error creating product');
    }
  });
});
</script>

{% endblock %}
