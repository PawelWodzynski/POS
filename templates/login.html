{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card card">
    <div class="card-body">
      <div class="text-center mb-4">
        <i class="bi bi-person-circle display-2 text-primary"></i>
        <h4 class="mt-2">Sign in to your account</h4>
        <p class="text-muted">Enter your credentials to access the POS</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="login" class="form-label">Login</label>
          <input type="text" class="form-control" id="login" name="login" placeholder="your login" required>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
        </div>

        <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-primary">Sign in</button>
        </div>
      </form>

      <hr class="my-4">

      <div class="d-flex justify-content-between">
        <small class="text-muted">Don't have an account?</small>
        <a href="{{ url_for('auth.register_page') }}" class="btn btn-outline-secondary btn-sm">Register</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
{% endblock %}
